# ==============================================================================
# Nginx 302 Redirect Rules for 机场社长 (jichangshezhang.com)
# 适用平台：Linux VPS / 宝塔面板 (aaPanel) / 1Panel Nginx 虚拟主机配置
# 使用方法：在站点 nginx 配置 server { ... } 区块内添加：
#          include /www/server/nginx/conf/nginx-redirects.conf; (或本文件实际路径)
# ==============================================================================

# 统一注入防爬与隐私隔离响应头
map $uri $is_go_redirect {
    default 0;
    ~^/go/ 1;
    /go.html 1;
}

# 1. 针对 /go.html 承接页禁止搜索引擎抓取与快照
location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}

# 2. 11 大核心机场 302 高速硬件隔离跳转
location ~ ^/go/shandianshu/?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 302 https://chenpin.shandianshuaff.com/#/?code=m28TvPVX;
}


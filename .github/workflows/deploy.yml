name: Build & Submit to IndexNow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: |
          set -e
          if ! npx astro build --verbose > build.log 2>&1; then
            echo "::error title=Astro Build Error::$(tail -n 25 build.log | tr '\n' ' ')"
            cat build.log
            exit 1
          fi
          cat build.log

      - name: Build Search Indexes
        run: npx pagefind --site dist

      - name: Sync Root Files
        run: node sync_root_index.cjs

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.cjs

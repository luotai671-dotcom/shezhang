name: Build & Submit to IndexNow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build:astro

      - name: Build Search Indexes & Sync
        run: |
          npx pagefind --site dist
          node sync_root_index.cjs

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.cjs

